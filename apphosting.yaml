# Settings for Cloud Run
runConfig:
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 10
  concurrency: 80

# Environment variables and secrets
env:
  - variable: STORAGE_BUCKET
    value: gen-lang-client-0989127214.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME
  - variable: API_KEY
    secret: myApiKeySecret

