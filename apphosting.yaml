# Settings for Firebase App Hosting
# Learn more: https://firebase.google.com/docs/app-hosting/configure

runConfig:
  minInstances: 0
  maxInstances: 5
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

scripts:
  buildCommand: npm run build
  runCommand: npm run start

env:
  - variable: NODE_ENV
    value: production
  - variable: PORT
    value: "8080"
