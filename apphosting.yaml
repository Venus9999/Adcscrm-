# Settings for Cloud Run / Firebase App Hosting
runConfig:
  cpu: 1
  memoryMiB: 1024
  minInstances: 0
  maxInstances: 5
  concurrency: 80

# Environment variables
env:
  - variable: NODE_ENV
    value: production
  - variable: STORAGE_BUCKET
    value: gen-lang-client-0989127214.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME

